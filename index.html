<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trade Journal V1</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b10;
  color:#f1f5f9;
}
.app{max-width:650px;margin:auto;padding:16px}
.header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px
}
.logo{font-size:22px;font-weight:800}
.logo span{color:#38bdf8}
.sub{font-size:11px;color:#64748b}

.tabs{
  display:grid;grid-template-columns:1fr 1fr;
  background:#11161e;border:1px solid #1e293b;
  border-radius:12px;padding:4px;margin-bottom:16px
}
.tab{
  border:0;background:transparent;color:#64748b;
  padding:11px;border-radius:9px;font-weight:700;
  cursor:pointer
}
.tab.active{background:#1e293b;color:#fff}

.card{
  background:#0e131a;
  border:1px solid #1e293b;
  border-radius:15px;
  padding:16px;
  margin-bottom:14px
}
.section-title{
  font-size:14px;font-weight:800;margin-bottom:14px
}
.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.full{grid-column:1/-1}

label{
  display:block;font-size:11px;
  color:#94a3b8;margin-bottom:6px
}
input,select,textarea{
  width:100%;background:#080b10;
  border:1px solid #263241;color:#fff;
  border-radius:9px;padding:11px;
  outline:none;font-size:13px
}
input:focus,select:focus,textarea:focus{
  border-color:#38bdf8
}
textarea{resize:vertical;min-height:75px}

.sessions{
  display:grid;grid-template-columns:1fr 1fr;gap:8px
}
.session{
  position:relative
}
.session input{display:none}
.session label{
  margin:0;padding:11px 8px;
  text-align:center;border:1px solid #263241;
  border-radius:9px;background:#080b10;
  cursor:pointer;font-size:11px;color:#94a3b8
}
.session input:checked+label{
  border-color:#38bdf8;
  background:#102332;color:#38bdf8
}

.direction{
  display:grid;grid-template-columns:1fr 1fr;gap:8px
}
.direction input{display:none}
.direction label{
  text-align:center;padding:11px;
  border:1px solid #263241;border-radius:9px;
  cursor:pointer;margin:0
}
.direction input:checked+label{
  border-color:#38bdf8;background:#102332;color:#38bdf8
}

.btn{
  width:100%;border:0;border-radius:10px;
  padding:12px;font-weight:800;cursor:pointer;
  background:#38bdf8;color:#031018
}
.btn.secondary{
  background:#17202b;color:#cbd5e1;
  border:1px solid #263241
}
.btn.danger{
  background:#3b1519;color:#fca5a5;
  border:1px solid #642126
}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.hidden{display:none!important}

.metrics{
  display:grid;grid-template-columns:repeat(2,1fr);gap:8px
}
.metric{
  background:#080b10;border:1px solid #1e293b;
  padding:12px;border-radius:10px
}
.metric small{display:block;color:#64748b;font-size:10px}
.metric strong{font-size:18px;margin-top:4px;display:block}

.trade{
  background:#0b1016;border:1px solid #1e293b;
  border-radius:12px;padding:13px;margin-bottom:9px
}
.trade-top{
  display:flex;justify-content:space-between;gap:8px;
  align-items:center
}
.trade-symbol{font-weight:800}
.win{color:#4ade80}
.loss{color:#f87171}
.breakeven{color:#facc15}
.trade-meta{
  color:#64748b;font-size:10px;margin-top:6px;
  line-height:1.7
}
.trade-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px
}
.trade-actions button{
  padding:8px;border-radius:8px;border:1px solid #263241;
  background:#111821;color:#cbd5e1;font-size:11px;
  font-weight:700
}

.empty{
  text-align:center;color:#64748b;
  padding:35px 10px;font-size:13px
}

.filter{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:10px
}

#previewImage{
  max-width:100%;border-radius:10px;
  margin-top:8px;display:none
}

@media(max-width:430px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="logo">TRADE<span>LOG</span></div>
      <div class="sub">V1 TRADING JOURNAL</div>
    </div>
    <div class="sub" id="tradeCount">0 TRADES</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="setupTab" onclick="showPage('setup')">
      1. LOG SETUP
    </button>
    <button class="tab" id="journalTab" onclick="showPage('journal')">
      2. JOURNAL
    </button>
  </div>

  <!-- ================= SETUP ================= -->

  <div id="setupPage">

    <div class="card">
      <div class="section-title">TRADE DETAILS</div>

      <div class="grid">

        <div>
          <label>DATE</label>
          <input type="date" id="date">
        </div>

        <div>
          <label>TIME</label>
          <input type="time" id="time">
        </div>

        <div>
          <label>ASSET</label>
          <select id="asset">
            <option value="">Select asset</option>
            <option>EURUSD</option>
            <option>XAUUSD</option>
            <option>GBPUSD</option>
            <option>NAS100</option>
            <option>US30</option>
            <option>USDJPY</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label>TIMEFRAME</label>
          <select id="timeframe">
            <option value="">Select timeframe</option>
            <option>1M</option>
            <option>5M</option>
            <option>15M</option>
            <option>30M</option>
            <option>1H</option>
            <option>4H</option>
          </select>
        </div>

      </div>
    </div>

    <div class="card">
      <div class="section-title">SESSION</div>

      <div class="sessions">

        <div class="session">
          <input type="radio" name="session" id="s1" value="Market Open 9:30-9:50 AM">
          <label for="s1">MARKET OPEN<br>9:30–9:50 AM</label>
        </div>

        <div class="session">
          <input type="radio" name="session" id="s2" value="Macro 9:50-10:20 AM">
          <label for="s2">MACRO<br>9:50–10:20 AM</label>
        </div>

        <div class="session">
          <input type="radio" name="session" id="s3" value="AM Silverbullet 10-10:30 AM">
          <label for="s3">AM SILVERBULLET<br>10–10:30 AM</label>
        </div>

        <div class="session">
          <input type="radio" name="session" id="s4" value="PM Session 2-4 PM">
          <label for="s4">PM SESSION<br>2–4 PM</label>
        </div>

      </div>
    </div>

    <div class="card">
      <div class="section-title">DIRECTION</div>

      <div class="direction">
        <div>
          <input type="radio" name="direction" id="long" value="Long">
          <label for="long">LONG ↑</label>
        </div>

        <div>
          <input type="radio" name="direction" id="short" value="Short">
          <label for="short">SHORT ↓</label>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">SETUP INFORMATION</div>

      <div class="grid">

        <div>
          <label>SETUP / MODEL</label>
          <select id="setup">
            <option value="">Select setup</option>
            <option>Unicorn</option>
            <option>FVG</option>
            <option>Breaker</option>
            <option>Liquidity Sweep</option>
            <option>Silver Bullet</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label>HTF BIAS</label>
          <select id="bias">
            <option value="">Select bias</option>
            <option>Bullish</option>
            <option>Bearish</option>
            <option>Neutral</option>
          </select>
        </div>

        <div>
          <label>ENTRY</label>
          <input type="number" step="any" id="entry" placeholder="0.00000">
        </div>

        <div>
          <label>STOP LOSS</label>
          <input type="number" step="any" id="sl" placeholder="0.00000">
        </div>

        <div>
          <label>TAKE PROFIT</label>
          <input type="number" step="any" id="tp" placeholder="0.00000">
        </div>

        <div>
          <label>R:R</label>
          <input type="number" step="0.01" id="rr" placeholder="2.0">
        </div>

        <div>
          <label>RESULT</label>
          <select id="result">
            <option value="">Select result</option>
            <option value="Win">Win</option>
            <option value="Loss">Loss</option>
            <option value="Breakeven">Breakeven</option>
          </select>
        </div>

        <div>
          <label>R MULTIPLE</label>
          <input type="number" step="0.01" id="rResult" placeholder="+2 / -1">
        </div>

      </div>
    </div>

    <div class="card">
      <div class="section-title">TRADE NOTES</div>

      <textarea id="notes" placeholder="What happened? Why did you take this trade? What did you learn?"></textarea>

      <label style="margin-top:12px">TRADE SCREENSHOT</label>
      <input type="file" id="image" accept="image/*" onchange="previewImage(event)">
      <img id="previewImage">

    </div>

    <div class="buttons">
      <button class="btn" id="saveBtn" onclick="saveTrade()">SAVE TRADE</button>
      <button class="btn secondary" onclick="resetForm()">CLEAR</button>
    </div>

  </div>

  <!-- ================= JOURNAL ================= -->

  <div id="journalPage" class="hidden">

    <div class="card">
      <div class="section-title">JOURNAL METRICS</div>

      <div class="metrics">
        <div class="metric">
          <small>TOTAL TRADES</small>
          <strong id="mTotal">0</strong>
        </div>

        <div class="metric">
          <small>WIN RATE</small>
          <strong id="mWinRate">0%</strong>
        </div>

        <div class="metric">
          <small>NET R</small>
          <strong id="mNetR">0R</strong>
        </div>

        <div class="metric">
          <small>AVG R</small>
          <strong id="mAvgR">0R</strong>
        </div>

        <div class="metric">
          <small>WINS</small>
          <strong id="mWins">0</strong>
        </div>

        <div class="metric">
          <small>LOSSES</small>
          <strong id="mLosses">0</strong>
        </div>

        <div class="metric">
          <small>PROFIT FACTOR</small>
          <strong id="mPF">0</strong>
        </div>

        <div class="metric">
          <small>BEST STREAK</small>
          <strong id="mStreak">0</strong>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">FILTER JOURNAL</div>

      <div class="filter">
        <select id="filterAsset" onchange="renderJournal()">
          <option value="">All Assets</option>
          <option>EURUSD</option>
          <option>XAUUSD</option>
          <option>GBPUSD</option>
          <option>NAS100</option>
          <option>US30</option>
          <option>USDJPY</option>
          <option>Other</option>
        </select>

        <select id="filterResult" onchange="renderJournal()">
          <option value="">All Results</option>
          <option>Win</option>
          <option>Loss</option>
          <option>Breakeven</option>
        </select>
      </div>

      <div class="buttons">
        <button class="btn secondary" onclick="exportCSV()">EXPORT CSV</button>
        <button class="btn danger" onclick="clearAllTrades()">DELETE ALL</button>
      </div>
    </div>

    <div id="journalList"></div>

  </div>

</div>

<script>

let trades = JSON.parse(localStorage.getItem("tradeJournalV1") || "[]");
let editingId = null;
let currentImage = "";

function $(id){
  return document.getElementById(id);
}

/* DEFAULT DATE + TIME */

function setCurrentDateTime(){
  const now = new Date();

  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,"0");
  const d = String(now.getDate()).padStart(2,"0");

  $("date").value = `${y}-${m}-${d}`;

  $("time").value =
    String(now.getHours()).padStart(2,"0") + ":" +
    String(now.getMinutes()).padStart(2,"0");
}

/* PAGE SWITCH */

function showPage(page){

  if(page === "setup"){

    $("setupPage").classList.remove("hidden");
    $("journalPage").classList.add("hidden");

    $("setupTab").classList.add("active");
    $("journalTab").classList.remove("active");

  }else{

    $("setupPage").classList.add("hidden");
    $("journalPage").classList.remove("hidden");

    $("setupTab").classList.remove("active");
    $("journalTab").classList.add("active");

    updateMetrics();
    renderJournal();
  }
}

/* IMAGE */

function previewImage(event){

  const file = event.target.files[0];

  if(!file)return;

  const reader = new FileReader();

  reader.onload = function(e){

    currentImage = e.target.result;

    $("previewImage").src = currentImage;
    $("previewImage").style.display = "block";

  };

  reader.readAsDataURL(file);
}

/* SAVE */

function saveTrade(){

  const session = document.querySelector('input[name="session"]:checked');
  const direction = document.querySelector('input[name="direction"]:checked');

  if(!$("date").value){
    alert("Please enter the trade date.");
    return;
  }

  if(!$("asset").value){
    alert("Please select an asset.");
    return;
  }

  if(!session){
    alert("Please select a session.");
    return;
  }

  if(!direction){
    alert("Please select Long or Short.");
    return;
  }

  const trade = {

    id: editingId || Date.now(),

    date: $("date").value,
    time: $("time").value,

    asset: $("asset").value,
    timeframe: $("timeframe").value,

    session: session.value,
    direction: direction.value,

    setup: $("setup").value,
    bias: $("bias").value,

    entry: $("entry").value,
    sl: $("sl").value,
    tp: $("tp").value,
    rr: $("rr").value,

    result: $("result").value,
    rResult: $("rResult").value,

    notes: $("notes").value,

    image: currentImage

  };

  if(editingId){

    const index = trades.findIndex(t => t.id === editingId);

    if(index !== -1){
      trades[index] = trade;
    }

    editingId = null;
    $("saveBtn").textContent = "SAVE TRADE";

  }else{

    trades.unshift(trade);

  }

  localStorage.setItem("tradeJournalV1", JSON.stringify(trades));

  resetForm();

  updateMetrics();

  alert("Trade saved successfully.");
}

/* RESET */

function resetForm(){

  editingId = null;
  currentImage = "";

  $("saveBtn").textContent = "SAVE TRADE";

  setCurrentDateTime();

  $("asset").value = "";
  $("timeframe").value = "";
  $("setup").value = "";
  $("bias").value = "";
  $("entry").value = "";
  $("sl").value = "";
  $("tp").value = "";
  $("rr").value = "";
  $("result").value = "";
  $("rResult").value = "";
  $("notes").value = "";

  document.querySelectorAll('input[name="session"]').forEach(x=>x.checked=false);
  document.querySelectorAll('input[name="direction"]').forEach(x=>x.checked=false);

  $("image").value = "";
  $("previewImage").style.display = "none";
  $("previewImage").src = "";
}

/* EDIT */

function editTrade(id){

  const t = trades.find(x=>x.id === id);

  if(!t)return;

  editingId = id;

  $("date").value = t.date || "";
  $("time").value = t.time || "";

  $("asset").value = t.asset || "";
  $("timeframe").value = t.timeframe || "";

  $("setup").value = t.setup || "";
  $("bias").value = t.bias || "";

  $("entry").value = t.entry || "";
  $("sl").value = t.sl || "";
  $("tp").value = t.tp || "";
  $("rr").value = t.rr || "";

  $("result").value = t.result || "";
  $("rResult").value = t.rResult || "";

  $("notes").value = t.notes || "";

  document.querySelectorAll('input[name="session"]').forEach(x=>{
    x.checked = x.value === t.session;
  });

  document.querySelectorAll('input[name="direction"]').forEach(x=>{
    x.checked = x.value === t.direction;
  });

  currentImage = t.image || "";

  if(currentImage){

    $("previewImage").src = currentImage;
    $("previewImage").style.display = "block";

  }else{

    $("previewImage").style.display = "none";

  }

  $("saveBtn").textContent = "UPDATE TRADE";

  showPage("setup");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* DELETE */

function deleteTrade(id){

  if(!confirm("Delete this trade?"))return;

  trades = trades.filter(t=>t.id !== id);

  localStorage.setItem("tradeJournalV1",JSON.stringify(trades));

  updateMetrics();
  renderJournal();
}

/* CLEAR EVERYTHING */

function clearAllTrades(){

  if(!trades.length)return;

  if(!confirm("Delete ALL saved trades? This cannot be undone."))return;

  trades = [];

  localStorage.removeItem("tradeJournalV1");

  updateMetrics();
  renderJournal();
}

/* METRICS */

function updateMetrics(){

  const total = trades.length;

  const wins = trades.filter(t=>t.result==="Win").length;
  const losses = trades.filter(t=>t.result==="Loss").length;

  const rValues = trades
    .map(t=>parseFloat(t.rResult))
    .filter(x=>!isNaN(x));

  const netR = rValues.reduce((a,b)=>a+b,0);

  const avgR = rValues.length ? netR/rValues.length : 0;

  const winRate = total ? (wins/total)*100 : 0;

  const grossProfit = trades
    .filter(t=>parseFloat(t.rResult)>0)
    .reduce((a,t)=>a+parseFloat(t.rResult),0);

  const grossLoss = Math.abs(
    trades
      .filter(t=>parseFloat(t.rResult)<0)
      .reduce((a,t)=>a+parseFloat(t.rResult),0)
  );

  const pf = grossLoss ? grossProfit/grossLoss : 0;

  let current=0;
  let best=0;

  trades.slice().reverse().forEach(t=>{

    if(t.result==="Win"){
      current++;
      best=Math.max(best,current);
    }else if(t.result==="Loss"){
      current=0;
    }

  });

  $("mTotal").textContent = total;
  $("mWinRate").textContent = winRate.toFixed(1)+"%";
  $("mNetR").textContent = formatR(netR);
  $("mAvgR").textContent = formatR(avgR);
  $("mWins").textContent = wins;
  $("mLosses").textContent = losses;
  $("mPF").textContent = pf.toFixed(2);
  $("mStreak").textContent = best;

  $("tradeCount").textContent =
    total + (total===1 ? " TRADE" : " TRADES");
}

function formatR(value){

  if(!isFinite(value))return "0R";

  return (value>0?"+":"") + value.toFixed(2) + "R";
}

/* JOURNAL */

function renderJournal(){

  const list = $("journalList");

  const assetFilter = $("filterAsset").value;
  const resultFilter = $("filterResult").value;

  let filtered = trades.filter(t=>{

    const assetOK =
      !assetFilter || t.asset===assetFilter;

    const resultOK =
      !resultFilter || t.result===resultFilter;

    return assetOK && resultOK;

  });

  if(!filtered.length){

    list.innerHTML =
      '<div class="card empty">No trades found.</div>';

    return;
  }

  list.innerHTML = filtered.map(t=>{

    let resultClass = "";

    if(t.result==="Win")resultClass="win";
    if(t.result==="Loss")resultClass="loss";
    if(t.result==="Breakeven")resultClass="breakeven";

    const image = t.image
      ? `<img src="${t.image}" style="width:100%;max-height:240px;object-fit:cover;border-radius:9px;margin-top:10px">`
      : "";

    return `

      <div class="trade">

        <div class="trade-top">

          <div class="trade-symbol">
            ${escapeHTML(t.asset || "—")}
            <span style="color:#64748b">
              ${t.direction==="Long" ? " ↑" : t.direction==="Short" ? " ↓" : ""}
            </span>
          </div>

          <strong class="${resultClass}">
            ${escapeHTML(t.result || "—")}
            ${t.rResult ? " "+formatR(parseFloat(t.rResult)) : ""}
          </strong>

        </div>

        <div class="trade-meta">

          ${escapeHTML(t.date || "")}
          ${t.time ? " • "+escapeHTML(t.time) : ""}

          <br>

          SESSION:
          ${escapeHTML(t.session || "—")}

          <br>

          SETUP:
          ${escapeHTML(t.setup || "—")}

          • HTF:
          ${escapeHTML(t.bias || "—")}

          <br>

          TF:
          ${escapeHTML(t.timeframe || "—")}

          • RR:
          ${escapeHTML(t.rr || "—")}

          <br>

          ENTRY:
          ${escapeHTML(t.entry || "—")}

          • SL:
          ${escapeHTML(t.sl || "—")}

          • TP:
          ${escapeHTML(t.tp || "—")}

        </div>

        ${
          t.notes
          ? `<div style="margin-top:9px;font-size:12px;color:#cbd5e1;line-height:1.5">
              ${escapeHTML(t.notes)}
             </div>`
          : ""
        }

        ${image}

        <div class="trade-actions">

          <button onclick="editTrade(${t.id})">
            EDIT
          </button>

          <button onclick="deleteTrade(${t.id})">
            DELETE
          </button>

        </div>

      </div>

    `;

  }).join("");
}

/* CSV EXPORT */

function exportCSV(){

  if(!trades.length){

    alert("There are no trades to export.");

    return;
  }

  const headers = [

    "Date",
    "Time",
    "Asset",
    "Timeframe",
    "Session",
    "Direction",
    "Setup",
    "HTF Bias",
    "Entry",
    "Stop Loss",
    "Take Profit",
    "RR",
    "Result",
    "R Result",
    "Notes"

  ];

  const rows = trades.map(t=>[

    t.date,
    t.time,
    t.asset,
    t.timeframe,
    t.session,
    t.direction,
    t.setup,
    t.bias,
    t.entry,
    t.sl,
    t.tp,
    t.rr,
    t.result,
    t.rResult,
    t.notes

  ]);

  const csv = [

    headers,

    ...rows

  ].map(row=>

    row.map(value=>

      `"${String(value ?? "").replace(/"/g,'""')}"`

    ).join(",")

  ).join("\n");

  const blob = new Blob(
    [csv],
    {type:"text/csv;charset=utf-8;"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download =
    "trade-journal-" +
    new Date().toISOString().slice(0,10) +
    ".csv";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);
}

/* SECURITY */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
