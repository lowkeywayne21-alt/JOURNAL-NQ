<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lowkey / journal</title>

<style>
:root{
--bg-main:#0b0d12;--card-bg:#131720;--card-border:#1e2430;
--input-bg:#181d28;--text-main:#e1e7f0;--text-muted:#626c7d;
--accent-blue:#3b82f6;--accent-blue-hover:#2563eb;
--win-color:#10b981;--loss-color:#ef4444;--be-color:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace}
body{background:var(--bg-main);color:var(--text-main);padding:16px;display:flex;justify-content:center}
.app-container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:16px}
.header-title{text-align:center;font-size:1.1rem;font-weight:700;letter-spacing:.1em;margin-bottom:8px}
.header-title span{color:var(--accent-blue)}
.nav-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card-bg);border:1px solid var(--card-border);padding:4px;border-radius:8px}
.tab-btn{background:transparent;border:none;color:var(--text-muted);padding:10px;font-size:.85rem;font-weight:600;border-radius:6px;cursor:pointer}
.tab-btn.active{background:var(--input-bg);color:var(--text-main);border:1px solid var(--card-border)}
.tab-content{display:none;flex-direction:column;gap:16px}.tab-content.active{display:flex}
.section-box,.calendar-card,.trade-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.section-header{font-size:.75rem;font-weight:700;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.section-header:after{content:"";flex:1;height:1px;background:var(--card-border)}
.form-group{display:flex;flex-direction:column;gap:6px}
label{font-size:.75rem;color:var(--text-muted);font-weight:600}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{
background:var(--input-bg);border:1px solid var(--card-border);color:var(--text-main);
padding:12px;border-radius:8px;font-size:.85rem;outline:none;width:100%
}
input:focus,select:focus,textarea:focus{border-color:var(--accent-blue)}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--accent-blue);cursor:pointer}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip-box{background:var(--input-bg);border:1px solid var(--card-border);border-radius:8px;padding:12px;text-align:center;font-size:.8rem;font-weight:600;cursor:pointer;user-select:none}
.chip-box.selected{background:var(--accent-blue);border-color:var(--accent-blue);color:white}
.sub-header{font-size:.7rem;color:var(--accent-blue);font-weight:700;margin-top:4px}
.btn-primary{background:var(--accent-blue);color:white;border:none;padding:14px;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer;width:100%}
.btn-primary:hover{background:var(--accent-blue-hover)}
.btn-secondary{background:var(--input-bg);border:1px solid var(--card-border);color:var(--text-main);padding:12px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer}
.btn-danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--loss-color);padding:12px;border-radius:8px;font-weight:600;cursor:pointer}
